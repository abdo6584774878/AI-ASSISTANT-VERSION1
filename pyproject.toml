[project]
name = "ai-assistant"
version = "0.1.0"
description = "A modular terminal-based AI assistant built with Python and Google Gemini."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "ipykernel>=7.3.0",
    "pwdlib[argon2]>=0.3.1",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.27",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
